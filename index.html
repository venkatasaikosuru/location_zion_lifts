<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#073665">
  <title>ZION-LIFTS | Find Nearest Center</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="landing">
    <section class="content" aria-label="Zion Lifts">
      <h1>ZION-LIFTS</h1>

      <a class="nearest-button" id="find-nearest" href="finder/index.html">
        <span>Find Nearest Center</span>
        <span class="pin" aria-hidden="true">📍</span>
      </a>

      <p class="hint">Tap button to locate</p>

      <nav class="social-links" aria-label="Social media">
        <!-- Replace # with the official profile URL when available. -->
        <a class="social instagram" href="#" aria-label="Instagram" title="Instagram">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle class="dot" cx="18" cy="6" r="1"></circle></svg>
        </a>
        <a class="social facebook" href="#" aria-label="Facebook" title="Facebook">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path class="solid" d="M24 12a12 12 0 1 0-13.875 11.85v-8.39H7.08V12h3.045V9.36c0-3.005 1.79-4.665 4.53-4.665 1.312 0 2.685.234 2.685.234v2.95h-1.512c-1.49 0-1.953.925-1.953 1.874V12h3.323l-.531 3.46h-2.792v8.39A12.003 12.003 0 0 0 24 12z"></path></svg>
        </a>
        <a class="social whatsapp" href="#" aria-label="WhatsApp" title="WhatsApp">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 11.7a8.4 8.4 0 0 1-12.4 7.4L3 20.5l1.4-4.9a8.4 8.4 0 1 1 16.1-3.9Z"></path><path d="M8.5 7.8c.2-.5.5-.5.8-.5h.5c.2 0 .4.1.5.4l.7 1.7c.1.2.1.4-.1.6l-.5.6c-.2.2-.2.4-.1.6.4.8 1.1 1.5 1.9 1.9.2.1.4.1.6-.1l.7-.8c.2-.2.4-.2.6-.1l1.6.8c.2.1.4.2.4.4 0 .3-.2 1.1-.7 1.5-.5.5-1.2.7-1.8.6-.6-.1-1.4-.3-2.4-.8-1.7-.8-2.8-2.5-2.9-2.6-.1-.2-.7-.9-.7-1.8 0-.9.5-1.4.7-1.6Z"></path></svg>
        </a>
      </nav>
    </section>
  </main>

  <!-- Loading screen: shown on this same page for 2  seconds before the finder opens -->
  <div id="loading-screen" class="loading-screen" role="status" aria-live="polite">
    <h2>ZION-LIFTS</h2>
    <p>locate you ....... </p>
  </div>

  <script>
    (function () {
      var DELAY_MS = 2000; // 2 seconds
      var button = document.getElementById('find-nearest');
      var overlay = document.getElementById('loading-screen');
      var clicked = false;

      button.addEventListener('click', function (e) {
        e.preventDefault();            // stop the instant jump to the finder
        if (clicked) return;           // ignore repeat clicks
        clicked = true;
        overlay.classList.add('show');
        setTimeout(function () {
          window.location.href = button.getAttribute('href');
        }, DELAY_MS);
      });

      // If the user comes back with the Back button, hide the overlay again.
      window.addEventListener('pageshow', function () {
        overlay.classList.remove('show');
        clicked = false;
      });
    })();
  </script>
</body>
</html>
